<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="header">
    <h1>My Image Gallery</h1>
    <p>Explore moments captured around the world.</p>
  </header>

  <main>
    <section class="gallery-section">
      <h2>Explore Photos</h2>

      <div class="gallery">
        <article class="gallery-item">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
            alt="Mountain landscape beside a lake"
          >
          <h3>Mountain Escape</h3>
        </article>

        <article class="gallery-item">
          <img
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600"
            alt="City skyline at night"
          >
          <h3>City Lights</h3>
        </article>

        <article class="gallery-item">
          <img
            src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
            alt="Wildlife in a natural landscape"
          >
          <h3>Wild Nature</h3>
        </article>

        <article class="gallery-item">
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
            alt="Scenic countryside landscape"
          >
          <h3>Open Horizons</h3>
        </article>
      </div>
    </section>
  </main>

</body>
</html>
